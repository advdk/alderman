<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2a2c">
<title>Alderman: A Hanseatic Trading Tale</title>
<meta name="description" content="A slow trading game of the Hanse. Lübeck, 1370: sail the Baltic, build a trading house and become alderman.">
<meta name="application-name" content="Alderman">
<meta name="apple-mobile-web-app-title" content="Alderman">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/im-fell-english-sc-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game"><div class="loading" id="loading">Unrolling the chart…</div></div>
<div id="fog"></div>
<div class="title" id="title" hidden>
  <div class="tcard">
    <svg class="temblem" width="86" height="80" viewBox="0 0 86 80" aria-hidden="true"><path d="M8 52h70l-9 16H18z" fill="#6b4426" stroke="#2b1c10" stroke-width="1.5"/><path d="M12 52l-4-8h14v8M74 52l4-8H62v8" fill="#8a5a33" stroke="#2b1c10" stroke-width="1.2"/><path d="M43 6v46" stroke="#2b1c10" stroke-width="2.5"/><path d="M24 12h38c3 12 3 24 0 34H24c-3-10-3-22 0-34z" fill="#efe3c4" stroke="#8a7a5a" stroke-width="1"/><path d="M33 12h6v34h-6zM47 12h6v34h-6z" fill="#b2462f"/><path d="M43 4l14 3-14 3z" fill="#c8402c"/><path d="M4 72c10-4 20 4 30 0s20 4 30 0 14 2 18 0" fill="none" stroke="#3e6a70" stroke-width="2"/></svg>
    <h1 data-noi18n>Alderman</h1>
    <p class="eyebrow">A Hanseatic Trading Tale</p>
    <p class="tsave" id="tSave"></p>
    <div class="tbtns">
      <button class="tb primary" id="tContinue">Continue</button>
      <button class="tb" id="tNew">New season</button>
      <div class="tconfirm" id="tConfirm" hidden><p id="tConfirmText"></p><div class="row"><button class="tb primary" id="tNewYes">Begin anew</button><button class="tb" id="tNewNo">Keep my season</button></div></div>
      <button class="tb" id="tSettings">Settings</button>
      <button class="tb" id="tHall">Hall of fame</button>
    </div>
  </div>
  <p class="tfoot">Lübeck · Anno Domini 1370</p>
</div>

<header class="titlebar carved docked">
  <div class="purse" title="Your purse">
    <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><g stroke="#6b4a14" stroke-width="1"><ellipse cx="9" cy="17" rx="8" ry="3.2" fill="#b98a2e"/><ellipse cx="9" cy="14.5" rx="8" ry="3.2" fill="#d6aa4a"/><ellipse cx="17" cy="16" rx="8" ry="3.2" fill="#c89a3a"/><ellipse cx="17" cy="13.3" rx="8" ry="3.2" fill="#e7c063"/><ellipse cx="13" cy="9" rx="8" ry="3.2" fill="#f0cf78"/></g></svg>
    <b id="sPurse">2,500 mk</b>
  </div>
  <div class="datebox" role="button" tabindex="0" aria-label="Game speed and settings"><div class="date" id="sDate">1 May 1370</div></div>
  <div class="hbtns">
  <button class="bell" id="vSettings" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#e3c273" stroke="#6b4a14" stroke-width="1" d="M10.3 2.2h3.4l.5 2.6c.6.2 1.2.5 1.8.9l2.4-1.1 2.4 2.4-1.1 2.4c.4.6.7 1.2.9 1.8l2.6.5v3.4l-2.6.5c-.2.6-.5 1.2-.9 1.8l1.1 2.4-2.4 2.4-2.4-1.1c-.6.4-1.2.7-1.8.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.8-.9l-2.4 1.1-2.4-2.4 1.1-2.4c-.4-.6-.7-1.2-.9-1.8l-2.6-.5v-3.4l2.6-.5c.2-.6.5-1.2.9-1.8L3.4 6.4l2.4-2.4 2.4 1.1c.6-.4 1.2-.7 1.8-.9z"/><circle cx="12" cy="12" r="3.4" fill="#3a2614" stroke="#6b4a14"/></svg></button>
  <button class="bell" id="bell" aria-label="Open the chronicle">
    <svg width="22" height="24" viewBox="0 0 22 24" aria-hidden="true"><path d="M11 2.5c-3.6 0-6 2.7-6 6.3v4.4L2.8 17h16.4L17 13.2V8.8c0-3.6-2.4-6.3-6-6.3z" fill="#e3c273" stroke="#6b4a14" stroke-width="1.1"/><path d="M8.3 19a2.8 2.8 0 0 0 5.4 0" fill="none" stroke="#e3c273" stroke-width="1.6" stroke-linecap="round"/><rect x="10" y="0.6" width="2" height="2.4" rx="1" fill="#e3c273"/></svg>
    <span class="badge" id="badge" hidden>0</span>
  </button>
  </div>
</header>

<nav class="bottombar carved docked" aria-label="Game">
  <button class="bb" id="vToggle"><svg id="vIcon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="vLabel">Sea chart</span></button>
  <button class="bb" id="vFleet"><svg width="26" height="24" viewBox="0 0 26 24" aria-hidden="true"><path d="M3 16h20l-3 5H6z" fill="#c89a5a" stroke="#6b4a14"/><path d="M13 2v14" stroke="#e3c273" stroke-width="1.6"/><path d="M13.8 3.5c4 1.5 5.5 5 5.8 10.5H13.8z" fill="#efe3c4"/><path d="M12.2 5c-3 1.5-4.2 4-4.5 9h4.5z" fill="#efe3c4"/></svg><span>Fleet</span></button>
</nav>
<button class="evbanner" id="evBanner" hidden></button>
<div class="pill" id="hint" hidden></div>
<div class="toast off" id="toast" role="status"></div>

<div class="dlg-wrap" id="dlgWrap" hidden>
  <article class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <button class="x" id="dlgX" aria-label="Close">×</button>
    <div id="dlgBody" style="display:contents"></div>
  </article>
</div>
<div class="letter-wrap" id="letterWrap" hidden>
  <article class="letter" role="dialog" aria-modal="true" aria-labelledby="lTitle">
    <p class="l-date" id="lDate"></p>
    <h3 id="lTitle">Honoured master,</h3>
    <div id="lBody"></div>
    <p class="sign">Your obedient factor,<br><span>Hinrich Vosge</span></p>
    <button class="btn" id="lClose">Back to the Kontor</button>
    <div class="seal" aria-hidden="true">H</div>
  </article>
</div>

<script src="vendor/phaser.min.js"></script>
<script src="js/native.js"></script>
<script src="js/i18n.js"></script>
<script src="js/game.js"></script>
</body>
</html>
